<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">ORBIT-Inspect</title>
  <desc id="desc">Process-aware industrial inspection across sensing, communication, and computation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101f2b"/>
      <stop offset="1" stop-color="#153d43"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="390" rx="20" fill="url(#background)"/>
  <rect width="1200" height="390" rx="20" fill="url(#grid)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="52" y="44" width="5" height="19" rx="2" fill="#7de0bb"/>
    <text x="70" y="59" fill="#98d9cf" font-size="14" letter-spacing="3">INDUSTRIAL SYSTEMS · RESEARCH TESTBED</text>
    <text x="48" y="133" fill="#ffffff" font-size="62" font-weight="700" letter-spacing="-2">ORBIT-Inspect</text>
    <text x="52" y="174" fill="#c1d4db" font-size="23">Every inspection has a deadline.</text>
    <text x="52" y="205" fill="#91adb9" font-size="17">Explore the complete sensing–communication–computation loop.</text>
    <g transform="translate(52 246)">
      <rect width="305" height="83" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#4b707a"/>
      <circle cx="30" cy="29" r="6" fill="#7de0bb"/>
      <text x="49" y="35" fill="#f4fbfc" font-size="19" font-weight="600">Sensing</text>
      <text x="23" y="62" fill="#a8c2cc" font-size="14">Isaac Sim · camera + conveyor</text>
      <path d="M320 41h47m-7-6 7 6-7 6" fill="none" stroke="#7de0bb" stroke-width="2"/>
      <rect x="383" width="305" height="83" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#4b707a"/>
      <circle cx="413" cy="29" r="6" fill="#83bffc"/>
      <text x="432" y="35" fill="#f4fbfc" font-size="19" font-weight="600">Communication</text>
      <text x="406" y="62" fill="#a8c2cc" font-size="14">5G O-RAN · OAI + FlexRIC</text>
      <path d="M703 41h47m-7-6 7 6-7 6" fill="none" stroke="#7de0bb" stroke-width="2"/>
      <rect x="766" width="278" height="83" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#4b707a"/>
      <circle cx="796" cy="29" r="6" fill="#f2ce87"/>
      <text x="815" y="35" fill="#f4fbfc" font-size="19" font-weight="600">Computation</text>
      <text x="789" y="62" fill="#a8c2cc" font-size="14">Edge inference · YOLO</text>
    </g>
    <text x="52" y="365" fill="#8fb6be" font-size="13" letter-spacing="1.5">CORRECT-ON-TIME RATE / PRODUCTION GOODPUT / RESOURCE ALLOCATION</text>
  </g>
